# AI зөвлөхийн дохиог өдөр бүр шинэчилж Firebase Hosting-д нийтэлнэ.
# Апп нь https://diplom-23056.web.app/ai/signals.json-оос татна.
#
# Нэг удаагийн тохиргоо (docs/signals_pipeline.md-г үз):
#   1. Firebase Console → Hosting → "Get started"
#   2. GitHub repo → Settings → Secrets → FIREBASE_SERVICE_ACCOUNT
#      (`firebase init hosting:github` автоматаар үүсгэнэ)
name: Refresh AI signals

on:
  schedule:
    # Ажлын өдөр 13:45 УБ цагаар (05:45 UTC) — MSE 13:00-д хаагдсаны дараа
    - cron: '45 5 * * 1-5'
    # Ням гараг 10:00 УБ — бүтэн түүхийг дахин татаж залруулна
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Бүх хувьцааны бүтэн түүхийг дахин татах'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Restore MSE dataset
        uses: actions/cache/restore@v4
        with:
          path: tool/data
          key: mse-dataset-${{ github.run_id }}
          restore-keys: mse-dataset-

      - name: Restore signal log (track record)
        run: |
          mkdir -p tool/data
          if [ ! -f tool/data/signal_log.json ]; then
            curl -fsS https://diplom-23056.web.app/ai/signal_log.json -o tool/data/signal_log.json               || echo "Нийтлэгдсэн бүртгэл алга — шинээр эхэлнэ"
          fi

      - name: Update MSE dataset
        run: |
          if [ "${{ github.event.schedule }}" = "0 2 * * 0" ] || [ "${{ inputs.full_refresh }}" = "true" ]; then
            dart run tool/build_dataset.dart --refresh
          else
            dart run tool/build_dataset.dart
          fi

      - name: Save MSE dataset
        uses: actions/cache/save@v4
        with:
          path: tool/data
          key: mse-dataset-${{ github.run_id }}

      - name: Train model and build signals
        run: dart run tool/train_advisor.dart

      - name: Run tests
        run: flutter test test/ai_engine_test.dart test/ai_engine_v2_test.dart test/history_update_test.dart test/goal_planner_test.dart

      - name: Prepare hosting files
        run: |
          mkdir -p build/hosting/ai
          cp assets/ai/signals.json assets/ai/advisor_model.json build/hosting/ai/
          cp docs/ai_model_report.md build/hosting/ai/report.md
          cp tool/data/signal_log.json build/hosting/ai/signal_log.json
          printf '<!doctype html><meta charset="utf-8"><title>AI signals</title><a href="ai/signals.json">signals.json</a> · <a href="ai/report.md">report</a>\n' > build/hosting/index.html

      - name: Keep a copy as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-signals
          path: build/hosting/ai
          retention-days: 30

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: diplom-23056
          channelId: live
