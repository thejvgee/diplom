# AI зөвлөхийн дохио, MSE-ийн ханш, вэб апп-ыг өдөр бүр шинэчилж Firebase
# Hosting-д (https://diplom-23056.web.app) нэг дор байршуулна:
#   /        вэб апп (flutter build web)
#   /ai/     signals.json — mobile ба вэб апп хоёулаа татна
#   /mse/    market.json + history/ — вэб апп (open.mse.mn CORS-гүй тул)
#
# Firebase Hosting нь deploy бүрт сайтыг бүхэлд нь солидог тул энэ гурвыг
# үргэлж хамт байршуулна (tool/assemble_hosting.dart).
#
# Нэг удаагийн тохиргоо (docs/signals_pipeline.md, docs/web_deploy.md):
#   1. Firebase Console → Hosting → "Get started"
#   2. GitHub repo → Settings → Secrets → FIREBASE_SERVICE_ACCOUNT
#      (`firebase init hosting:github` автоматаар үүсгэнэ)
name: Refresh AI signals and deploy web

on:
  schedule:
    # Ажлын өдөр 13:45 УБ цагаар (05:45 UTC) — MSE 13:00-д хаагдсаны дараа
    - cron: '45 5 * * 1-5'
    # Ням гараг 10:00 УБ — бүтэн түүхийг дахин татаж залруулна
    - cron: '0 2 * * 0'
  # main-д апп-ын код өөрчлөгдөхөд вэб хувилбарыг шууд шинэчилнэ
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
      - '.github/workflows/refresh-signals.yml'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Бүх хувьцааны бүтэн түүхийг дахин татах'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh-signals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Restore MSE dataset
        uses: actions/cache/restore@v4
        with:
          path: tool/data
          key: mse-dataset-${{ github.run_id }}
          restore-keys: mse-dataset-

      - name: Restore signal log (track record)
        run: |
          mkdir -p tool/data
          if [ ! -f tool/data/signal_log.json ]; then
            curl -fsS https://diplom-23056.web.app/ai/signal_log.json -o tool/data/signal_log.json               || echo "Нийтлэгдсэн бүртгэл алга — шинээр эхэлнэ"
          fi

      - name: Update MSE dataset
        run: |
          if [ "${{ github.event.schedule }}" = "0 2 * * 0" ] || [ "${{ inputs.full_refresh }}" = "true" ]; then
            dart run tool/build_dataset.dart --refresh
          else
            dart run tool/build_dataset.dart
          fi

      - name: Save MSE dataset
        uses: actions/cache/save@v4
        with:
          path: tool/data
          key: mse-dataset-${{ github.run_id }}

      - name: Train model and build signals
        run: dart run tool/train_advisor.dart

      - name: Run tests
        run: flutter test test/ai_engine_test.dart test/ai_engine_v2_test.dart test/history_update_test.dart test/goal_planner_test.dart test/mse_snapshot_service_test.dart

      # open.mse.mn CORS header өгдөггүй тул вэб апп энэ JSON-оос уншина
      - name: Publish MSE quotes (I–III) for the web app
        run: dart run tool/publish_market.dart --out build/mse

      # Шинэ signals.json апп-д багцлагдахын тулд сургалтын дараа build хийнэ.
      # Firebase-ийн вэб тохиргоог апп сайтын /__/firebase/init.json-оос
      # уншина; FIREBASE_WEB_API_KEY secret (заавал биш) өгвөл түүгээр.
      - name: Build web app
        run: flutter build web --release --dart-define=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}

      - name: Assemble hosting folder (web + ai + mse)
        run: dart run tool/assemble_hosting.dart --web build/web --mse build/mse --out build/hosting

      - name: Keep a copy as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-signals
          path: |
            build/hosting/ai
            build/hosting/mse/market.json
          retention-days: 30

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: diplom-23056
          channelId: live
